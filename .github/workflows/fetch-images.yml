name: Fetch site images

on:
  push:
    paths:
      - scripts/images.txt
      - .github/workflows/fetch-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images from the current site
        run: |
          base="https://www.kidderminsterpetroleumservices.com/wp-content/uploads/"
          while read -r rel; do
            [ -z "$rel" ] && continue
            mkdir -p "assets/img/$(dirname "$rel")"
            curl -fsSL -A "Mozilla/5.0" "$base$rel" -o "assets/img/$rel" && echo "OK   $rel" || echo "FAIL $rel"
          done < scripts/images.txt
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet || git commit -m "Add site images from current site"
          git push
